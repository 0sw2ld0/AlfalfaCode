# La suite completa y ruff en Ubuntu 24.04, con las órdenes aisladas en bubblewrap como en un servidor.
# Ubuntu limita con AppArmor los espacios de nombres de usuario: se carga el mismo perfil para bwrap
# que explica docs/USO.md («Linux: el sandbox»). Sin secretos y con permiso de sólo lectura.
name: Linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: bwrap, rg, file y poppler-utils
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep file poppler-utils
      - name: Perfil de AppArmor para bwrap
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-user --unshare-net true && echo "bwrap arranca"
      - name: Dependencias
        run: python -m pip install -e '.[dev]'
      - name: ruff
        run: ruff check .
      - name: Suite
        run: python -m pytest -q -p no:cacheprovider
