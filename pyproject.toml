[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfalfa"
dynamic = ["version"]
description = "AlfalfaCode: arnés de agentes de programación para modelos de Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.29,<2",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24", "ruff>=0.12"]

[project.scripts]
alfalfa = "alfalfa.terminal:main"

[tool.setuptools.dynamic]
version = {attr = "alfalfa.__version__"}

[tool.setuptools.packages.find]
include = ["alfalfa*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.sbpl", "*.swift", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Estilo del código Python: `ruff check .` desde la raíz del repositorio.
# E (pycodestyle), F (pyflakes) e I (orden de los import), con líneas de 120 columnas
# como la app de Mac.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I"]
