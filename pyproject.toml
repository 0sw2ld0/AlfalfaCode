[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfalfa"
dynamic = ["version"]
description = "AlfalfaCode: arnés de agentes de programación para modelos de Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.29,<2",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24"]

[project.scripts]
alfalfa = "alfalfa.terminal:main"

[tool.setuptools.dynamic]
version = {attr = "alfalfa.__version__"}

[tool.setuptools.packages.find]
include = ["alfalfa*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.sbpl", "*.swift", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
